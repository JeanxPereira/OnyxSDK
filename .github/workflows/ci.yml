# OnyxSDK CI — the repo's first CI (Task 12, Onyx v1 M4 "Vulkan" milestone).
#
# HONEST NOTE (read before trusting a green or red run): as of writing,
# this repo's remote has never received the feat/onyx-v1-m4-vulkan branch
# this file was authored on -- pushing it is a pending human action. This
# workflow was authored and locally lint-checked
# (`python -c "import yaml,sys; yaml.safe_load(open('.github/workflows/ci.yml'))"`)
# but has NEVER actually executed on a GitHub-hosted runner. In particular:
#
#   - The linux-lavapipe job's VK_ICD_FILENAMES discovery step (below) has
#     never observed a real Ubuntu runner's /usr/share/vulkan/icd.d/
#     layout; it lists the directory and picks the lavapipe entry by glob
#     specifically so a wrong guess cannot silently point at nothing.
#   - VkOracleParity's tolerance (Tools/OnyxOracle/CMakeLists.txt's
#     ONYX_PARITY_ARGS: 160 / 2.0% differing / 0.8% high-delta / 1.0 MAE)
#     is a SINGLE-GPU POINT ESTIMATE measured on real AMD hardware (RX 6750
#     XT, see task-7-report.md) -- lavapipe is a software rasterizer with
#     its own MSAA sample-position implementation, so a VkOracleParity
#     FAIL on this job's first real run is expected to be a tuning event,
#     not proof the renderer regressed. Read the --emit-metrics numbers in
#     the job log (VkParityTest.cmake always requests them) before assuming
#     a real bug; if the shape matches "edge-adjacent, whole-image MAE
#     still small," bump ONYX_PARITY_ARGS in one place and move on --
#     that is what the single cache variable exists for.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (cl.exe/link.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja + MSVC -- the repo's normal preset, README's "Building standalone")
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        # This runner has no GPU (and possibly no Vulkan loader at all).
        # Every render-labeled ctest entry (VkBootSmoke, VkValidationSelfTest,
        # VkSceneSmoke, OracleReproducible, VkOracleParity --
        # Tools/OnyxOracle/CMakeLists.txt; OnyxCliRender --
        # Examples/OnyxCli/CMakeLists.txt) calls VkContext::Init, which
        # returns exit 77 uniformly whether volkInitialize() finds no
        # Vulkan loader at all (Source/RenderVk/VkContext.cpp) or the
        # loader finds no physical device -- either way, on this runner,
        # the process exits 77. Each of those six tests carries
        # SKIP_RETURN_CODE 77, which is CTest's own "treat this exit code
        # as SKIP, not FAIL" contract: ctest reports the test "Not Run"
        # and does NOT count it toward the run's pass/fail verdict, so the
        # overall `ctest` process still exits 0 with 6 skips among the 47
        # registered tests. Nothing here should ever legitimately go red
        # from a missing GPU.
        run: ctest --test-dir build -j1 --output-on-failure

  linux-lavapipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + lavapipe (software Vulkan)
        # mesa-vulkan-drivers ships lavapipe (the "lvp" ICD) alongside
        # every hardware Mesa driver it also carries; libvulkan1 is the
        # loader itself. No FFmpeg dev packages here on purpose -- see the
        # configure step below.
        #
        # F5 fix: xorg-dev added -- GLFW (pinned 3.3.9, root CMakeLists.txt)
        # is built from source here via FetchContent, and on Linux its
        # default CMake build needs the X11 dev headers (Xlib, Xrandr,
        # Xinerama, Xcursor, Xi, Xext, ...) to configure at all; without
        # them CMake's GLFW subproject fails before this job ever reaches
        # a Vulkan test. xorg-dev is the umbrella package Ubuntu ships for
        # exactly that header set (also what GLFW's own Linux build docs
        # point at). Nothing Wayland-related added: 3.3.9 only builds the
        # X11 backend by default (GLFW's Wayland backend became a
        # default-alongside-X11 build in 3.4, not 3.3.x, and nothing in
        # this repo's CMakeLists opts into GLFW_USE_WAYLAND), so
        # libwayland-dev/libxkbcommon-dev would be unused weight here.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan1 xorg-dev

      - name: Locate the lavapipe ICD
        # Do NOT hardcode a guessed ICD json path -- mesa-vulkan-drivers'
        # exact filename/layout under /usr/share/vulkan/icd.d/ is not a
        # stable contract across Ubuntu/Mesa releases. List what actually
        # got installed and pick the lavapipe entry (named lvp_icd.*.json
        # by Mesa convention) by glob instead.
        run: |
          echo "Installed Vulkan ICDs:"
          ls -la /usr/share/vulkan/icd.d/
          ICD=$(ls /usr/share/vulkan/icd.d/ | grep -i '^lvp' | head -n1)
          if [ -z "$ICD" ]; then
            echo "::error::No lavapipe ICD (lvp_icd.*.json) found under /usr/share/vulkan/icd.d/ -- mesa-vulkan-drivers layout may have changed, update this glob."
            exit 1
          fi
          echo "Using $ICD"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/$ICD" >> "$GITHUB_ENV"

      - name: Configure (Ninja + gcc, Media off)
        # ONYX_COMPONENT_MEDIA=OFF: the root CMakeLists.txt's non-Windows
        # FFmpeg discovery is a hard `pkg_check_modules(FFMPEG REQUIRED
        # ...)` against libavformat/libavcodec/libswscale/libswresample/
        # libavutil -- none of which are installed on this runner, and
        # pulling in whatever version Ubuntu's apt currently carries is
        # exactly the FFmpeg-version fight this task is scoped to avoid.
        # The Linux FFmpeg path is not proven anywhere in this repo today
        # (Windows gets a pinned prebuilt archive instead -- see
        # CMakeLists.txt's own FFmpeg comment), so Media stays off here;
        # Onyx_Media is optional by design (ONYX_COMPONENT_MEDIA's own doc
        # string) and nothing else in the tree depends on it.
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DONYX_COMPONENT_MEDIA=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        # Unlike windows-msvc, lavapipe is a real (if software) Vulkan-
        # capable device, so every render-labeled test -- VkOracleParity
        # above all -- actually RUNS here and gates the PR for real. See
        # this workflow's header for why a VkOracleParity tolerance FAIL on
        # the very first run of this job is expected to be a tuning event.
        run: ctest --test-dir build -j1 --output-on-failure
