# OnyxSDK CI — the repo's first CI (Task 12, Onyx v1 M4 "Vulkan" milestone;
# extended at Task 9, Onyx v1 M5 "Generality", with the cold-start header
# exam on windows-msvc and refreshed ctest counts for the v1.0.0 tag).
#
# HONEST NOTE (read before trusting a green or red run): as of writing,
# this repo's remote has never received the feat/onyx-v1-m4-vulkan branch
# this file was authored on -- pushing it is a pending human action, still
# true at the v1.0.0 tag. This workflow was authored and locally
# lint-checked
# (`python -c "import yaml,sys; yaml.safe_load(open('.github/workflows/ci.yml'))"`)
# but has NEVER actually executed on a GitHub-hosted runner. In particular:
#
#   - The linux-lavapipe job's VK_ICD_FILENAMES discovery step (below) has
#     never observed a real Ubuntu runner's /usr/share/vulkan/icd.d/
#     layout; it lists the directory and picks the lavapipe entry by glob
#     specifically so a wrong guess cannot silently point at nothing.
#   - VkOracleParity's tolerance (Tools/OnyxOracle/CMakeLists.txt's
#     ONYX_PARITY_ARGS: 160 / 2.0% differing / 0.8% high-delta / 1.0 MAE)
#     is a SINGLE-GPU POINT ESTIMATE measured on real AMD hardware (RX 6750
#     XT, see task-7-report.md) -- lavapipe is a software rasterizer with
#     its own MSAA sample-position implementation, so a VkOracleParity
#     FAIL on this job's first real run is expected to be a tuning event,
#     not proof the renderer regressed. Read the --emit-metrics numbers in
#     the job log (VkParityTest.cmake always requests them) before assuming
#     a real bug; if the shape matches "edge-adjacent, whole-image MAE
#     still small," bump ONYX_PARITY_ARGS in one place and move on --
#     that is what the single cache variable exists for.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (cl.exe/link.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja + MSVC -- the repo's normal preset, README's "Building standalone")
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Cold-start exam, half 1 of 2 -- COMPILE <Onyx/Onyx.h> alone, public headers only
        # The milestone's spine (see docs/design/2026-08-19-public-surface-
        # audit.md): a toolkit author who has only cloned the repo and
        # configured once must be able to compile a TU that includes
        # nothing but <Onyx/Onyx.h> against -I Include plus third-party
        # dirs alone -- explicitly NO -I Source, NO -I build/generated.
        #
        # Half 2 is the `ColdStart` ctest entry in the Test step below: the
        # same TU, built by the ColdStartToolkit target against Onyx::Onyx
        # and nothing else, then RUN. Neither half subsumes the other --
        # only this step can prove the header closure needs no
        # CMake-supplied include path, and only a link can prove that what
        # the umbrella declares is actually callable. Through v0.6.0 the
        # exam was this step alone, which is exactly why an umbrella
        # declaring API from three unlinked targets survived four review
        # rounds.
        # Include/Onyx/Version.h is checked into the tree (fbd54d3), so
        # the umbrella's first include resolves without depending on this
        # job's own configure having run -- it is exercised here anyway
        # because build/_deps/*-src (populated by the Configure step
        # above via FetchContent, the same mechanism a consumer's own
        # FetchContent would use) is the natural source for the
        # third-party dirs the umbrella needs. This step compiles
        # Tools/ColdStart/ColdStartOnyx.cpp OUTSIDE CMake on purpose:
        # through-CMake compilation puts build/generated on the include
        # path via ordinary target properties, which is what half 2 does
        # and what this half must not. Command verified locally (MSVC,
        # this exact set of -I dirs) before this step was authored; see
        # task-9-report.md. The TU it compiles is no longer a trivial
        # `int main(){}` -- that was the audit's own "Variant A", which
        # the audit itself caught false-passing while the umbrella was
        # missing eight headers a real toolkit needs. It now registers a
        # module, parses a container, decodes an entry and resolves a
        # selection: Variant B's shape.
        #
        # NOT duplicated on linux-lavapipe below: this step's exact
        # compiler invocation (cl.exe via ilammy/msvc-dev-cmd) has no
        # equivalent proven from this dispatch's Windows-only environment
        # -- a g++/clang++ invocation was not exercised against a real
        # Ubuntu toolchain here, and adding an unverified step would be
        # exactly the "wishful CI" this repo's own convention warns
        # against (see this file's own header note on lavapipe). Porting
        # this check to linux-lavapipe is flagged as follow-up work, not
        # silently skipped.
        #
        # shell: cmd (not the runner's pwsh default) -- `^` line
        # continuation below is cmd syntax; this is the exact invocation
        # verified locally via cmd.exe, unchanged.
        shell: cmd
        run: |
          cl /c /EHsc /utf-8 /std:c++20 /nologo ^
            -I Include ^
            -I build\_deps\imgui-src ^
            -I build\_deps\glm-src ^
            -I build\_deps\glfw-src\include ^
            -I build\_deps\tomlplusplus-src\include ^
            -I build\_deps\lz4-src\lib ^
            -I build\_deps\imgui_color_text_edit-src ^
            Tools\ColdStart\ColdStartOnyx.cpp

      - name: Test
        # This runner has no GPU (and possibly no Vulkan loader at all).
        # Every render-labeled ctest entry (VkBootSmoke, VkValidationSelfTest,
        # VkSceneSmoke, RenderToImageSmoke, OracleReproducible, VkOracleParity --
        # Tools/OnyxOracle/CMakeLists.txt; OnyxCliRender, OnyxCliRenderViews,
        # OnyxCliRenderStrict -- Examples/OnyxCli/CMakeLists.txt) calls
        # VkContext::Init, which returns exit 77 uniformly whether
        # volkInitialize() finds no Vulkan loader at all
        # (Source/Rendering/VkContext.cpp) or the loader finds no physical
        # device -- either way, on this runner, the process exits 77. Each
        # of those nine tests carries SKIP_RETURN_CODE 77, which is
        # CTest's own "treat this exit code as SKIP, not FAIL" contract:
        # ctest reports the test "Not Run" and does NOT count it toward
        # the run's pass/fail verdict, so the overall `ctest` process
        # still exits 0 with 9 skips among the 53 registered tests
        # (updated as of the v1.0 tag -- M5 added OnyxTestKit and OnyxGltf
        # among others; re-check this count if it drifts again). This
        # includes OnyxTestKit (Tests/testkit_test.cpp, Onyx::TestKit's
        # golden/decode-smoke/render-compare helpers): ctest with no -R
        # filter runs every registered test, so no separate invocation is
        # needed to exercise it on both jobs. This step is also where the
        # cold-start exam's half 2 runs: the `ColdStart` entry (label
        # "surface") executes ColdStartToolkit, which links Onyx::Onyx and
        # nothing else. It is headless, carries no SKIP_RETURN_CODE, and
        # must pass on both jobs -- a GPU-less runner is no excuse for it.
        # Nothing else here should ever legitimately go red from a missing
        # GPU.
        run: ctest --test-dir build -j1 --output-on-failure

  linux-lavapipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + lavapipe (software Vulkan)
        # mesa-vulkan-drivers ships lavapipe (the "lvp" ICD) alongside
        # every hardware Mesa driver it also carries; libvulkan1 is the
        # loader itself. No FFmpeg dev packages here on purpose -- see the
        # configure step below.
        #
        # F5 fix: xorg-dev added -- GLFW (pinned 3.3.9, root CMakeLists.txt)
        # is built from source here via FetchContent, and on Linux its
        # default CMake build needs the X11 dev headers (Xlib, Xrandr,
        # Xinerama, Xcursor, Xi, Xext, ...) to configure at all; without
        # them CMake's GLFW subproject fails before this job ever reaches
        # a Vulkan test. xorg-dev is the umbrella package Ubuntu ships for
        # exactly that header set (also what GLFW's own Linux build docs
        # point at). Nothing Wayland-related added: 3.3.9 only builds the
        # X11 backend by default (GLFW's Wayland backend became a
        # default-alongside-X11 build in 3.4, not 3.3.x, and nothing in
        # this repo's CMakeLists opts into GLFW_USE_WAYLAND), so
        # libwayland-dev/libxkbcommon-dev would be unused weight here.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan1 xorg-dev

      - name: Locate the lavapipe ICD
        # Do NOT hardcode a guessed ICD json path -- mesa-vulkan-drivers'
        # exact filename/layout under /usr/share/vulkan/icd.d/ is not a
        # stable contract across Ubuntu/Mesa releases. List what actually
        # got installed and pick the lavapipe entry (named lvp_icd.*.json
        # by Mesa convention) by glob instead.
        run: |
          echo "Installed Vulkan ICDs:"
          ls -la /usr/share/vulkan/icd.d/
          ICD=$(ls /usr/share/vulkan/icd.d/ | grep -i '^lvp' | head -n1)
          if [ -z "$ICD" ]; then
            echo "::error::No lavapipe ICD (lvp_icd.*.json) found under /usr/share/vulkan/icd.d/ -- mesa-vulkan-drivers layout may have changed, update this glob."
            exit 1
          fi
          echo "Using $ICD"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/$ICD" >> "$GITHUB_ENV"

      - name: Configure (Ninja + gcc, Media off)
        # ONYX_COMPONENT_MEDIA=OFF: the root CMakeLists.txt's non-Windows
        # FFmpeg discovery is a hard `pkg_check_modules(FFMPEG REQUIRED
        # ...)` against libavformat/libavcodec/libswscale/libswresample/
        # libavutil -- none of which are installed on this runner, and
        # pulling in whatever version Ubuntu's apt currently carries is
        # exactly the FFmpeg-version fight this task is scoped to avoid.
        # The Linux FFmpeg path is not proven anywhere in this repo today
        # (Windows gets a pinned prebuilt archive instead -- see
        # CMakeLists.txt's own FFmpeg comment), so Media stays off here;
        # Onyx_Media is optional by design (ONYX_COMPONENT_MEDIA's own doc
        # string) and nothing else in the tree depends on it.
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DONYX_COMPONENT_MEDIA=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        # Unlike windows-msvc, lavapipe is a real (if software) Vulkan-
        # capable device, so every render-labeled test -- VkOracleParity
        # above all -- actually RUNS here and gates the PR for real. See
        # this workflow's header for why a VkOracleParity tolerance FAIL on
        # the very first run of this job is expected to be a tuning event.
        # No -R filter, same as windows-msvc: every registered test runs,
        # including OnyxTestKit -- there is no separate TestKit-only
        # invocation to keep in sync between the two jobs.
        run: ctest --test-dir build -j1 --output-on-failure
