name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: build/windows-debug/_deps
          key: deps-windows-debug-${{ hashFiles('cmake/Deps/*.cmake') }}

      # Media.Unit runs on both runners (the Windows configure downloads FFmpeg);
      # Media.Gpu skips on Windows.
      # Hosted Windows runners have no Vulkan device: Gpu.Device, Render.Gpu,
      # Render.Parity, Render.Reproducible, Ui.Gpu, Shell.Window and
      # Examples.Embedded exit 77 and report SKIP here. Examples.Build needs
      # no device and runs.
      - name: Check
        run: py -3 tools/check.py --preset windows-debug

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mesa-vulkan-drivers provides lavapipe, a CPU Vulkan device, so the
      # device suites run here (Ui.Gpu included). Render.Parity reads the
      # software profile. GLFW builds from source and needs the X11 and
      # Wayland development packages. The runner has no display, so
      # Shell.Window and Examples.Embedded exit 77 and report SKIP.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build glslang-tools libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libxkbcommon-dev libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev pkg-config

      - uses: actions/cache@v4
        with:
          path: build/linux-debug/_deps
          key: deps-linux-debug-${{ hashFiles('cmake/Deps/*.cmake') }}

      - name: Check
        run: python3 tools/check.py --preset linux-debug
