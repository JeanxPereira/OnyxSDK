# The frozen corpus PNGs are the render oracle. A profile is chosen by the device type.
# hardware: measured on the GPU the v1 parity gate was tuned on (AMD Radeon RX 6750 XT).
[hardware]
maxChannelDelta = 160
maxDifferingPct = 2.0
maxHighDeltaPct = 0.8
maxMae = 1.0

# software: lavapipe (Mesa llvmpipe Vulkan, Mesa 25.2.8, LLVM 20.1.2). Cause: the corpus was rendered on AMD,
# which exports colour to 8-bit targets as fp16 rounded toward zero, while lavapipe rounds fp32 to nearest and
# filters UNORM8 textures in 8-bit fixed point; interior pixels near a rounding boundary move by one step, and
# edge deltas stay as on hardware. maxDifferingPct is loose by design because a one-step drift touches up to
# 15% of pixels; maxChannelDelta, maxHighDeltaPct and maxMae carry the gate.
# Values: per-knob maxima of three identical runs over the corpus plus 10%.
[software]
maxChannelDelta = 135
maxDifferingPct = 16.0
maxHighDeltaPct = 0.46
maxMae = 0.21
